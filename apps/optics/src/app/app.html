<div class="flex min-h-screen flex-col bg-richblack-900 font-inter overflow-x-hidden overflow-y-hidden">
    <!-- <app-navbar></app-navbar> -->
    <main class="flex-grow">
        <router-outlet>
            <ngx-spinner bdColor="rgba(0, 8, 20, 0.8)" [fullScreen]="true" template="
          <div class='spinner-container'>
            <span class='loader'></span>
            <p class='spinner-text'>Loading...</p>
          </div>
          <style>
            .spinner-container {
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 12px;
            }
            .spinner-text {
              color: #FFD60A;
              font-weight: 500;
              font-size: 16px;
            }
            .loader {
              width: 54px;
              height: 54px;
              border-radius: 50%;
              display: inline-block;
              position: relative;
              border: 4px solid;
              border-color: #FFD60A #FFD60A transparent transparent;
              box-sizing: border-box;
              animation: rotation 1s linear infinite;
            }
            .loader::after,
            .loader::before {
              content: '';
              position: absolute;
              inset: 0;
              margin: auto;
              border: 4px solid;
              border-radius: 50%;
              box-sizing: border-box;
            }
            .loader::after {
              width: 42px;
              height: 42px;
              border-color: transparent transparent #00BFFF #00BFFF;
              animation: rotationBack 0.8s linear infinite;
            }
            .loader::before {
              width: 30px;
              height: 30px;
              border-color: white white transparent transparent;
              animation: rotation 1.2s linear infinite;
            }
            @keyframes rotation {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(360deg); }
            }
            @keyframes rotationBack {
              0% { transform: rotate(0deg); }
              100% { transform: rotate(-360deg); }
            }
          </style>
        ">
            </ngx-spinner>
        </router-outlet>
    </main>
</div>
