<!-- login.component.html -->
<div class="min-h-screen flex items-center justify-center bg-blue-100 px-4">
    <div
        class="bg-white p-6 sm:p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-sm sm:max-w-md md:max-w-lg border-t-8 border-blue-600">
        <h2 class="text-2xl sm:text-3xl md:text-4xl font-extrabold mb-6 sm:mb-8 text-center text-blue-600">
            Admin Login
        </h2>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Email Field -->
            <div class="mb-4 sm:mb-6">
                <label class="block mb-1 sm:mb-2 text-gray-700 font-semibold" for="email">Email</label>
                <input type="email" id="email" formControlName="email" placeholder="Enter your email"
                    class="w-full p-2 sm:p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800" />
                <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
                    class="text-red-500 text-sm mt-1">
                    Valid email is required
                </p>
            </div>

            <!-- Password Field -->
            <div class="mb-2 sm:mb-4">
                <label class="block mb-1 sm:mb-2 text-gray-700 font-semibold" for="password">Password</label>
                <input type="password" id="password" formControlName="password" placeholder="Enter your password"
                    class="w-full p-2 sm:p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800" />
                <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                    class="text-red-500 text-sm mt-1">
                    Password is required
                </p>
            </div>

            <!-- Forgot Password Link -->
            <div class="text-right mb-6 sm:mb-8">
                <a href="/forgot-password" class="text-blue-600 text-sm hover:underline">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-blue-600 text-white font-bold py-2 sm:py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md text-sm sm:text-base">
                Login
            </button>
        </form>

        <!-- Footer -->
        <p class="mt-4 sm:mt-6 text-center text-gray-500 text-xs sm:text-sm">
            &copy; 2025 Your Company. All rights reserved.
        </p>
    </div>
</div>
